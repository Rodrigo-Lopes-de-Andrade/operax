.fg }}\">{{ d.nome }}<\u002Fdiv>\n                        <div style=\"font-size:var(--text-2xs); color:{{ d.subFg }}\">{{ d.nota }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ d.disponivel }}\">\n                        <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Checkbox\" checked=\"{{ d.marcado }}\" sc-camel-on-change=\"{{ d.alternar }}\" hint-size=\"18px,18px\"><\u002Fx-import>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ d.bloqueado }}\">\n                        <span style=\"font-size:var(--text-2xs); font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint)\">indisponível<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ alr.avisoIndividual }}\">\n                <div style=\"display:flex; gap:14px; padding:16px; border-radius:var(--radius-lg); background:var(--alert-background); border:1px solid var(--alert-foreground)\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"users-round\" size=\"18\" hint-size=\"18px,18px\"><\u002Fx-import>\n                  <div>\n                    <div style=\"font-size:var(--text-sm); font-weight:700; color:var(--alert-foreground)\">Grupos ficam fora quando o conteúdo é individual<\u002Fdiv>\n                    <p style=\"font-size:var(--text-xs); color:var(--alert-foreground); margin-top:5px; text-wrap:pretty\">Mensagem individual cita nome e horário de um colaborador. Em grupo, isso expõe a pessoa a terceiros. Para avisar um grupo, mude o conteúdo para agregado — a mesma ocorrência vira contagem por unidade, sem nome.<\u002Fp>\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"arrow-left-right\" sc-camel-on-click=\"{{ alr.mudarAgregado }}\" style=\"{{ alr.mt10 }}\" hint-size=\"auto,32px\">Mudar para agregado<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex; align-items:center; gap:10px; padding-top:4px\">\n                <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" icon=\"check\" hint-size=\"auto,40px\">Salvar desligada<\u002Fx-import>\n                <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"ghost\" hint-size=\"auto,40px\">Descartar<\u002Fx-import>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <span style=\"font-size:var(--text-2xs); color:var(--text-faint)\">Salvar não liga a regra<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-5)\">\n              <div class=\"aegis-eyebrow\">Prévia da mensagem<\u002Fdiv>\n              <div style=\"margin-top:12px; padding:14px 16px; border-radius:14px 14px 14px 4px; background:var(--surface-muted); font-size:var(--text-sm); color:var(--text-strong); text-wrap:pretty\">{{ alr.previa }}<\u002Fdiv>\n              <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:10px; text-wrap:pretty\">{{ alr.previaNota }}<\u002Fp>\n              <p style=\"font-size:var(--text-2xs); color:var(--text-faint); margin-top:6px; text-wrap:pretty\">A mensagem informa o horário observado. Ela pode chegar até 40 minutos depois do fato, por causa da cadência de sincronização.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFolha }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px; max-width:1340px\">\n          <sc-if value=\"{{ fol.naoImportada }}\">\n            <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.EmptyState\" icon=\"calendar-clock\" tone=\"neutral\" compact=\"{{ true }}\" title=\"Competência 08/2026 ainda não importada\" description=\"O relatório da contabilidade chega entre o 5º e o 8º dia útil. Os números abaixo são de 07/2026 e não incluem o mês corrente.\" hint-size=\"100%,220px\">\n              <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" icon=\"file-up\" sc-camel-on-click=\"{{ fol.irImportar }}\" hint-size=\"auto,40px\">Importar competência<\u002Fx-import>\n              <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"ghost\" icon=\"history\" hint-size=\"auto,40px\">Ver 07/2026<\u002Fx-import>\n            <\u002Fx-import>\n          <\u002Fsc-if>\n\n          <div style=\"display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr; gap:16px\">\n            <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-6)\">\n              <div class=\"aegis-eyebrow\">Folha total · {{ fol.competencia }}<\u002Fdiv>\n              <div class=\"aegis-tnum\" style=\"font-size:var(--text-4xl); font-weight:800; color:var(--text-strong); line-height:1; margin-top:10px; letter-spacing:var(--tracking-tight)\">{{ fol.total }}<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px; margin-top:12px\">\n                <span class=\"aegis-tnum\" style=\"font-size:var(--text-sm); font-weight:700; color:var(--text-body)\">{{ fol.variacao }}<\u002Fspan>\n                <span style=\"font-size:var(--text-xs); color:var(--text-muted)\">vs. competência anterior<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ fol.kpis }}\" as=\"k\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-5)\">\n                <div class=\"aegis-eyebrow\">{{ k.k }}<\u002Fdiv>\n                <div class=\"aegis-tnum\" style=\"font-size:var(--text-2xl); font-weight:700; color:var(--text-strong); margin-top:8px\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size:var(--text-2xs); color:var(--text-faint); margin-top:4px\">{{ k.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:1.4fr 1fr; gap:16px\">\n            <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-5)\">\n              <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:16px\">\n                <div>\n                  <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Evolução mensal<\u002Fh3>\n                  <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px\">Proventos + encargos · 12 competências<\u002Fp>\n                <\u002Fdiv>\n                <span style=\"font-size:var(--text-xs); color:var(--text-muted)\">Linha tracejada: média de 12 meses<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative; display:flex; align-items:flex-end; gap:10px; height:190px; margin-top:20px\">\n                <div style=\"position:absolute; left:0; right:0; bottom:74px; border-top:1px dashed var(--border-strong)\"><\u002Fdiv>\n                <sc-for list=\"{{ fol.meses }}\" as=\"m\" hint-placeholder-count=\"12\">\n                  <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end\">\n                    <span class=\"aegis-tnum\" style=\"font-size:9px; color:var(--text-faint)\">{{ m.valor }}<\u002Fspan>\n                    <div style=\"width:100%; border-radius:5px 5px 0 0; background:{{ m.cor }}; height:{{ m.h }}px\"><\u002Fdiv>\n                    <span class=\"aegis-mono\" style=\"font-size:9px; color:var(--text-faint)\">{{ m.mes }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-5)\">\n              <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Movimentação<\u002Fh3>\n              <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px\">Admissões e desligamentos na competência<\u002Fp>\n              <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:18px\">\n                <sc-for list=\"{{ fol.movimento }}\" as=\"mv\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex; align-items:center; gap:12px\">\n                    <span style=\"font-size:var(--text-sm); color:var(--text-body); flex:1\">{{ mv.k }}<\u002Fspan>\n                    <span class=\"aegis-tnum\" style=\"font-size:var(--text-md); font-weight:700; color:{{ mv.color }}\">{{ mv.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"height:1px; background:var(--border-subtle); margin:18px 0\"><\u002Fdiv>\n              <div class=\"aegis-eyebrow\">Desvio contra média histórica<\u002Fdiv>\n              <p style=\"font-size:var(--text-sm); color:var(--text-body); margin-top:8px; text-wrap:pretty\">A folha de 07/2026 ficou <b class=\"aegis-tnum\">3,8%<\u002Fb> acima da média de 12 meses. Duas unidades explicam a diferença: Aeroporto e Shopping Norte.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); overflow:hidden\">\n            <div style=\"display:flex; align-items:center; gap:12px; padding:18px 22px\">\n              <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Custo por unidade<\u002Fh3>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"download\" hint-size=\"auto,32px\">Baixar XLS<\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ fol.uniCols }}\" rows=\"{{ fol.uniRows }}\" hint-size=\"100%,320px\"><\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAdmin }}\">\n        <div data-screen-label=\"Administração\" style=\"display:flex; flex-direction:column; gap:16px; max-width:1440px\">\n          <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:0 8px\">\n            <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Tabs\" tabs=\"{{ adm.tabs }}\" value=\"{{ adm.tab }}\" sc-camel-on-change=\"{{ adm.setTab }}\" hint-size=\"100%,44px\"><\u002Fx-import>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ adm.isMap }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:16px\">\n              <div style=\"display:flex; gap:24px; align-items:center; flex-wrap:wrap; padding:20px 24px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm)\">\n                <div style=\"flex:1; min-width:320px\">\n                  <div class=\"aegis-eyebrow\">Curadoria de vínculo<\u002Fdiv>\n                  <h3 style=\"font-size:var(--text-xl); font-weight:700; color:var(--text-strong); margin-top:4px\"><span class=\"aegis-tnum\">47<\u002Fspan> de <span class=\"aegis-tnum\">182<\u002Fspan> colaboradores com vínculo não validado<\u002Fh3>\n                  <p style=\"font-size:var(--text-sm); color:var(--text-muted); margin-top:4px; max-width:640px; text-wrap:pretty\">A origem entrega empresa e departamento ambíguos para 26% do quadro. A curadoria é feita uma vez, aqui. Enquanto não for confirmado explicitamente, o vínculo permanece marcado como não validado e não entra no consolidado de custo.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"width:260px\">\n                  <div style=\"display:flex; justify-content:space-between; font-size:var(--text-xs); color:var(--text-muted); margin-bottom:6px\">\n                    <span>Validados<\u002Fspan><span class=\"aegis-tnum\" style=\"font-weight:700; color:var(--text-strong)\">74%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:10px; border-radius:var(--radius-pill); background:var(--surface-muted); overflow:hidden\">\n                    <div style=\"height:100%; width:74%; background:var(--brand); border-radius:var(--radius-pill)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; gap:8px; margin-top:14px\">\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" size=\"sm\" icon=\"wand-sparkles\" sc-camel-on-click=\"{{ adm.aplicarAltas }}\" hint-size=\"auto,32px\">Aplicar sugestões ≥ 90%<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); overflow:hidden\">\n                <div style=\"display:flex; align-items:center; gap:14px; padding:14px 22px; flex-wrap:wrap\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.SegmentedControl\" options=\"{{ adm.filtroOpts }}\" value=\"{{ adm.filtro }}\" sc-camel-on-change=\"{{ adm.setFiltro }}\" size=\"sm\" hint-size=\"auto,36px\"><\u002Fx-import>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <span style=\"display:inline-flex; align-items:center; gap:12px; font-size:var(--text-2xs); color:var(--text-faint)\">\n                    <span><b class=\"aegis-mono\">↑ ↓<\u002Fb> percorre<\u002Fspan>\n                    <span><b class=\"aegis-mono\">Espaço<\u002Fb> marca<\u002Fspan>\n                    <span><b class=\"aegis-mono\">Enter<\u002Fb> aplica a sugestão<\u002Fspan>\n                    <span><b class=\"aegis-mono\">Shift+Enter<\u002Fb> aplica e avança<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ adm.temSelecao }}\">\n                  <div style=\"display:flex; align-items:center; gap:12px; padding:12px 22px; background:var(--brand-soft); border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle); flex-wrap:wrap\">\n                    <span class=\"aegis-tnum\" style=\"font-size:var(--text-sm); font-weight:700; color:var(--brand)\">{{ adm.selecionados }} selecionados<\u002Fspan>\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" size=\"sm\" icon=\"check\" sc-camel-on-click=\"{{ adm.validarSelecao }}\" hint-size=\"auto,32px\">Aplicar sugestão e validar<\u002Fx-import>\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"building-2\" hint-size=\"auto,32px\">Atribuir unidade manualmente<\u002Fx-import>\n                    <span style=\"flex:1\"><\u002Fspan>\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"ghost\" size=\"sm\" sc-camel-on-click=\"{{ adm.limparSelecao }}\" hint-size=\"auto,32px\">Limpar seleção<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"overflow-x:auto\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ adm.mapCols }}\" rows=\"{{ adm.mapRows }}\" density=\"compact\" sticky-header=\"{{ true }}\" empty=\"{{ adm.mapVazio }}\" hint-size=\"100%,420px\"><\u002Fx-import>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid var(--border-subtle)\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Pagination\" page=\"{{ adm.pagina }}\" page-count=\"{{ adm.paginas }}\" total=\"{{ adm.total }}\" page-size=\"{{ adm.porPagina }}\" sc-camel-on-page=\"{{ adm.setPagina }}\" sc-camel-on-page-size=\"{{ adm.setPorPagina }}\" label=\"vínculos\" hint-size=\"100%,52px\"><\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adm.isUnidades }}\">\n            <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); overflow:hidden\">\n              <div style=\"display:flex; align-items:center; gap:12px; padding:18px 22px\">\n                <div>\n                  <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Unidades<\u002Fh3>\n                  <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px\">Cadastro local. O código de origem é o que casa com o relógio de ponto.<\u002Fp>\n                <\u002Fdiv>\n                <span style=\"flex:1\"><\u002Fspan>\n                <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" size=\"sm\" icon=\"plus\" hint-size=\"auto,32px\">Nova unidade<\u002Fx-import>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ adm.uniCols }}\" rows=\"{{ adm.uniRows }}\" hint-size=\"100%,320px\"><\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adm.isUsuarios }}\">\n            <div style=\"display:flex; flex-direction:column; gap:16px\">\n              <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); overflow:hidden\">\n                <div style=\"display:flex; align-items:center; gap:12px; padding:18px 22px\">\n                  <div>\n                    <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Usuários, papéis e escopo<\u002Fh3>\n                    <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px\">O papel define quais blocos existem na tela; o escopo define quais unidades o papel alcança.<\u002Fp>\n                  <\u002Fdiv>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" size=\"sm\" icon=\"user-plus\" hint-size=\"auto,32px\">Convidar<\u002Fx-import>\n                <\u002Fdiv>\n                <div style=\"overflow-x:auto\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ adm.usrCols }}\" rows=\"{{ adm.usrRows }}\" hint-size=\"100%,360px\"><\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:flex-start; gap:14px; padding:16px 20px; border-radius:var(--radius-lg); background:var(--surface-muted); border:1px solid var(--border-subtle)\">\n                <span style=\"color:var(--text-muted); margin-top:1px\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"shield\" size=\"18\" hint-size=\"18px,18px\"><\u002Fx-import>\n                <\u002Fspan>\n                <p style=\"font-size:var(--text-sm); color:var(--text-body); text-wrap:pretty; max-width:900px\">São nove papéis, e a diferença entre eles não é permissão de botão: supervisor de unidade não vê remuneração, documento de identidade nem exame ocupacional — esses blocos não existem na tela dele. Trocar o papel de um usuário muda a superfície que ele passa a ver no próximo acesso.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adm.isIntegracoes }}\">\n            <div style=\"display:flex; flex-direction:column; gap:16px\">\n              <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:16px\">\n                <sc-for list=\"{{ adm.integracoes }}\" as=\"ig\" hint-placeholder-count=\"3\">\n                  <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-5)\">\n                    <div style=\"display:flex; align-items:center; gap:10px\">\n                      <span style=\"display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:var(--radius-md); background:{{ ig.bg }}; color:{{ ig.fg }}\">\n                        <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"{{ ig.icon }}\" size=\"18\" hint-size=\"18px,18px\"><\u002Fx-import>\n                      <\u002Fspan>\n                      <div style=\"flex:1; min-width:0\">\n                        <div style=\"font-size:var(--text-base); font-weight:700; color:var(--text-strong)\">{{ ig.nome }}<\u002Fdiv>\n                        <div style=\"font-size:var(--text-2xs); color:var(--text-muted)\">{{ ig.papel }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; align-items:baseline; gap:8px; margin-top:16px\">\n                      <span class=\"aegis-tnum\" style=\"font-size:var(--text-2xl); font-weight:800; color:{{ ig.fg }}\">{{ ig.valor }}<\u002Fspan>\n                      <span style=\"font-size:var(--text-xs); color:var(--text-muted)\">{{ ig.unidadeValor }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:8px; text-wrap:pretty\">{{ ig.nota }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:var(--space-5)\">\n                <div style=\"display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap\">\n                  <div style=\"flex:1; min-width:280px\">\n                    <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Provedor de WhatsApp<\u002Fh3>\n                    <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; text-wrap:pretty\">Um provedor ativo por tenant. Trocar de provedor muda o que o canal exige da mensagem — e, nos não oficiais, quem responde pelo número.<\u002Fp>\n                  <\u002Fdiv>\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Badge\" tone=\"{{ adm.wpp.tom }}\" size=\"sm\" dot=\"{{ true }}\" hint-size=\"auto,20px\">{{ adm.wpp.resumo }}<\u002Fx-import>\n                <\u002Fdiv>\n\n                <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:16px\">\n                  <sc-for list=\"{{ adm.wpp.opcoes }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ p.escolher }}\" style=\"text-align:left; padding:16px; border-radius:var(--radius-lg); cursor:pointer; font-family:var(--font-sans); background:{{ p.bg }}; border:1px solid {{ p.border }}\">\n                      <div style=\"display:flex; align-items:center; gap:9px\">\n                        <span style=\"width:14px; height:14px; border-radius:50%; flex:none; border:2px solid {{ p.dotBorder }}; background:{{ p.dot }}\"><\u002Fspan>\n                        <span style=\"font-size:var(--text-sm); font-weight:700; color:var(--text-strong)\">{{ p.nome }}<\u002Fspan>\n                        <span style=\"flex:1\"><\u002Fspan>\n                        <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Badge\" tone=\"{{ p.tipoTom }}\" size=\"sm\" hint-size=\"auto,20px\">{{ p.tipo }}<\u002Fx-import>\n                      <\u002Fdiv>\n                      <div style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:9px\">{{ p.chamada }}<\u002Fdiv>\n                      <div style=\"display:flex; flex-direction:column; gap:5px; margin-top:12px\">\n                        <sc-for list=\"{{ p.linhas }}\" as=\"l\" hint-placeholder-count=\"3\">\n                          <div style=\"display:flex; align-items:flex-start; gap:7px\">\n                            <span style=\"color:{{ l.fg }}; margin-top:1px\">\n                              <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"{{ l.icon }}\" size=\"13\" hint-size=\"13px,13px\"><\u002Fx-import>\n                            <\u002Fspan>\n                            <span style=\"font-size:var(--text-2xs); color:{{ l.fg }}; text-wrap:pretty\">{{ l.texto }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"display:flex; gap:14px; margin-top:14px; padding:16px; border-radius:var(--radius-lg); background:{{ adm.wpp.notaBg }}; border:1px solid {{ adm.wpp.notaFg }}\">\n                  <span style=\"color:{{ adm.wpp.notaFg }}; margin-top:1px\">\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"{{ adm.wpp.notaIcon }}\" size=\"18\" hint-size=\"18px,18px\"><\u002Fx-import>\n                  <\u002Fspan>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:var(--text-sm); font-weight:700; color:{{ adm.wpp.notaFg }}\">{{ adm.wpp.notaTitulo }}<\u002Fdiv>\n                    <p style=\"font-size:var(--text-xs); color:{{ adm.wpp.notaFg }}; margin-top:5px; text-wrap:pretty\">{{ adm.wpp.notaTexto }}<\u002Fp>\n                  <\u002Fdiv>\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"{{ adm.wpp.acaoIcon }}\" hint-size=\"auto,32px\">{{ adm.wpp.acao }}<\u002Fx-import>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ adm.wpp.exigeTemplate }}\">\n                  <div style=\"margin-top:16px\">\n                    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:10px\">\n                      <span style=\"font-size:var(--text-sm); font-weight:700; color:var(--text-strong)\">Templates do tenant<\u002Fspan>\n                      <span style=\"font-size:var(--text-xs); color:var(--text-muted)\">só template aprovado entrega mensagem<\u002Fspan>\n                      <span style=\"flex:1\"><\u002Fspan>\n                      <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"ghost\" size=\"sm\" icon=\"plus\" hint-size=\"auto,32px\">Novo template<\u002Fx-import>\n                    <\u002Fdiv>\n                    <div style=\"margin:0 -20px -20px; overflow-x:auto\">\n                      <div style=\"overflow-x:auto\">\n                        <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ adm.wpp.tplCols }}\" rows=\"{{ adm.wpp.tplRows }}\" density=\"compact\" hint-size=\"100%,240px\"><\u002Fx-import>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); overflow:hidden\">\n                <div style=\"display:flex; align-items:center; gap:12px; padding:18px 22px\">\n                  <div>\n                    <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Execuções de sincronização<\u002Fh3>\n                    <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px\">A cada 30 minutos. Duas falhas consecutivas disparam a regra de alerta de sincronização.<\u002Fp>\n                  <\u002Fdiv>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"refresh-cw\" hint-size=\"auto,32px\">Executar agora<\u002Fx-import>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:14px; padding:12px 22px; background:var(--surface-muted); border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle)\">\n                  <span style=\"width:8px; height:8px; border-radius:50%; background:var(--brand); flex:none\"><\u002Fspan>\n                  <span style=\"font-size:var(--text-sm); font-weight:600; color:var(--text-strong)\">09:10 · em execução<\u002Fspan>\n                  <div style=\"flex:1; max-width:320px\">\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Skeleton\" lines=\"2\" height=\"10\" hint-size=\"100%,30px\"><\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"overflow-x:auto\">\n                  <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ adm.syncCols }}\" rows=\"{{ adm.syncRows }}\" density=\"compact\" hint-size=\"100%,300px\"><\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adm.isAuditoria }}\">\n            <div style=\"background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); overflow:hidden\">\n              <div style=\"display:flex; align-items:center; gap:12px; padding:18px 22px\">\n                <div>\n                  <h3 style=\"font-size:var(--text-lg); font-weight:700; color:var(--text-strong)\">Trilha de auditoria<\u002Fh3>\n                  <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:2px\">Somente leitura. Registro imutável de quem viu dado sensível, quem mudou regra e quem validou vínculo.<\u002Fp>\n                <\u002Fdiv>\n                <span style=\"flex:1\"><\u002Fspan>\n                <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"download\" hint-size=\"auto,32px\">Exportar período<\u002Fx-import>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Table\" columns=\"{{ adm.audCols }}\" rows=\"{{ adm.audRows }}\" density=\"compact\" hint-size=\"100%,360px\"><\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ adm.toast }}\">\n          <div style=\"position:fixed; right:28px; bottom:28px; z-index:70\">\n            <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Toast\" tone=\"good\" title=\"{{ adm.toast.title }}\" description=\"{{ adm.toast.desc }}\" action=\"{{ adm.desfazer }}\" action-label=\"Desfazer\" sc-camel-on-close=\"{{ adm.fecharToast }}\" hint-size=\"380px,80px\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTv }}\">\n        <div data-screen-label=\"Painel de TV\" style=\"display:flex; flex-direction:column; gap:18px\">\n          <div style=\"display:flex; align-items:center; gap:12px; font-size:var(--text-xs); color:var(--text-muted)\">\n            <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"monitor\" size=\"15\" hint-size=\"15px,15px\"><\u002Fx-import>\n            <span>Pré-visualização em escala. Na parede, o painel ocupa a tela inteira e alterna os blocos sozinho.<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <span>Somente agregado — nenhum nome de colaborador<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"background:#0B1220; border-radius:var(--radius-2xl); padding:40px 44px; display:flex; flex-direction:column; gap:32px; min-height:720px; box-shadow:var(--shadow-lg)\">\n            <div style=\"display:flex; align-items:flex-end; gap:32px; flex-wrap:wrap\">\n              <div style=\"flex:1; min-width:320px\">\n                <div style=\"font-size:24px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#7FA0C8\">Kastro Park · operação<\u002Fdiv>\n                <div style=\"font-size:52px; font-weight:800; color:#F5F7FA; line-height:1.05; margin-top:6px\">Situação do dia<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"font-size:24px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:{{ tv.leituraFg }}\">Última leitura<\u002Fdiv>\n                <div class=\"aegis-mono\" style=\"font-size:80px; font-weight:800; line-height:1; color:{{ tv.leituraFg }}\">{{ tv.leitura }}<\u002Fdiv>\n                <div style=\"font-size:24px; color:#7FA0C8; margin-top:6px\">{{ tv.leituraNota }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ tv.bloco1 }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:20px\">\n                <sc-for list=\"{{ tv.unidades }}\" as=\"u\" hint-placeholder-count=\"6\">\n                  <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius-xl); padding:24px 26px; display:flex; flex-direction:column; gap:14px\">\n                    <div style=\"display:flex; align-items:center; gap:12px\">\n                      <span style=\"width:14px; height:14px; border-radius:50%; flex:none; background:{{ u.dot }}\"><\u002Fspan>\n                      <span style=\"font-size:30px; font-weight:700; color:#F5F7FA\">{{ u.nome }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; align-items:baseline; gap:12px\">\n                      <span class=\"aegis-tnum\" style=\"font-size:64px; font-weight:800; line-height:1; color:#F5F7FA\">{{ u.presentes }}<\u002Fspan>\n                      <span class=\"aegis-tnum\" style=\"font-size:30px; color:#7FA0C8\">/ {{ u.previstos }} previstos<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; align-items:center; gap:10px\">\n                      <span class=\"aegis-tnum\" style=\"font-size:32px; font-weight:800; color:{{ u.ocFg }}\">{{ u.ocorrencias }}<\u002Fspan>\n                      <span style=\"font-size:26px; color:#B8C6DC\">{{ u.ocLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ tv.bloco2 }}\">\n              <div style=\"display:grid; grid-template-columns:1.1fr 1fr; gap:24px; flex:1\">\n                <div style=\"display:flex; flex-direction:column; gap:28px\">\n                  <div>\n                    <div style=\"font-size:26px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#7FA0C8; margin-bottom:20px\">Ocorrências do dia por tipo<\u002Fdiv>\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Chart\" type=\"rankbar\" data=\"{{ tv.tipos }}\" color=\"#7FA8FE\" label-size=\"28px\" value-size=\"30px\" bar-height=\"16\" label-color=\"#E7EDF5\" value-color=\"#FFFFFF\" track=\"rgba(255,255,255,0.1)\" gap=\"18\" hint-size=\"100%,260px\"><\u002Fx-import>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:26px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#7FA0C8; margin-bottom:16px\">Últimos 7 dias · minutos de desvio<\u002Fdiv>\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Chart\" type=\"trend\" data=\"{{ tv.evolucao }}\" height=\"150\" color=\"#7FA8FE\" grid-color=\"rgba(255,255,255,0.12)\" label-color=\"#7FA0C8\" label-size=\"24px\" hint-size=\"100%,190px\"><\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:26px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#7FA0C8; margin-bottom:20px\">Alertas prioritários<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:16px\">\n                    <sc-for list=\"{{ tv.alertas }}\" as=\"a\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex; align-items:center; gap:18px; padding:20px 22px; border-radius:var(--radius-lg); background:{{ a.bg }}; border-left:6px solid {{ a.accent }}\">\n                        <span class=\"aegis-tnum\" style=\"font-size:44px; font-weight:800; line-height:1; color:{{ a.accent }}; min-width:64px\">{{ a.n }}<\u002Fspan>\n                        <div>\n                          <div style=\"font-size:28px; font-weight:700; color:#F5F7FA\">{{ a.titulo }}<\u002Fdiv>\n                          <div style=\"font-size:24px; color:#B8C6DC; margin-top:2px\">{{ a.nota }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex; align-items:center; gap:20px; margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1)\">\n              <span style=\"font-size:24px; color:#7FA0C8\">{{ tv.rodape }}<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:24px; color:#7FA0C8\">{{ tv.blocoLabel }}<\u002Fspan>\n              <span style=\"display:inline-flex; gap:10px\">\n                <sc-for list=\"{{ tv.dots }}\" as=\"d\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ d.ir }}\" style=\"width:18px; height:18px; border-radius:50%; border:none; cursor:pointer; padding:0; background:{{ d.bg }}\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ drawer }}\">\n    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Drawer\" eyebrow=\"Indício de desvio\" title=\"{{ drawer.nome }}\" subtitle=\"{{ drawer.sub }}\" sc-camel-on-close=\"{{ fecharDrawer }}\" hint-size=\"520px,100%\">\n        <div style=\"display:flex; flex-direction:column; gap:18px\">\n          <div style=\"padding:16px; border-radius:var(--radius-lg); background:var(--surface-muted); border:1px solid var(--border-subtle)\">\n            <div style=\"font-size:var(--text-base); color:var(--text-strong); font-weight:600; text-wrap:pretty\">{{ drawer.frase }}<\u002Fdiv>\n            <div style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:6px\">Detectado às {{ drawer.detectado }} · a leitura pode chegar até 30 minutos após o fato<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:12px\">\n            <div>\n              <div class=\"aegis-eyebrow\">Previsto<\u002Fdiv>\n              <div class=\"aegis-mono\" style=\"font-size:var(--text-md); color:var(--text-strong); margin-top:4px\">{{ drawer.prev }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"aegis-eyebrow\">Registrado<\u002Fdiv>\n              <div class=\"aegis-mono\" style=\"font-size:var(--text-md); color:var(--text-strong); margin-top:4px\">{{ drawer.reg }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"aegis-eyebrow\">Minutos<\u002Fdiv>\n              <div class=\"aegis-tnum\" style=\"font-size:var(--text-md); font-weight:700; margin-top:4px; color:{{ drawer.minColor }}\">{{ drawer.min }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"aegis-eyebrow\" style=\"margin-bottom:8px\">Marcações do dia<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:8px\">\n              <sc-for list=\"{{ drawer.batidas }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid var(--border-subtle); border-radius:var(--radius-md)\">\n                  <span class=\"aegis-mono\" style=\"font-size:var(--text-sm); font-weight:600; color:var(--text-strong); width:52px\">{{ b.h }}<\u002Fspan>\n                  <span style=\"font-size:var(--text-sm); color:var(--text-body); flex:1\">{{ b.k }}<\u002Fspan>\n                  <span style=\"font-size:var(--text-2xs); color:var(--text-faint)\">{{ b.fonte }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"primary\" icon=\"external-link\" sc-camel-full-width=\"{{ true }}\" hint-size=\"100%,40px\">Conferir no Secullum<\u002Fx-import>\n            <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" icon=\"message-square-plus\" sc-camel-full-width=\"{{ true }}\" hint-size=\"100%,40px\">Registrar justificativa<\u002Fx-import>\n            <p style=\"font-size:var(--text-2xs); color:var(--text-faint); text-align:center; text-wrap:pretty\">A apuração oficial é feita no sistema de ponto. O OperaX não altera marcação.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fx-import>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;papel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;DP / Financeiro&quot;,&quot;Supervisor de unidade&quot;],&quot;default&quot;:&quot;DP / Financeiro&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Papel e cenário&quot;},&quot;cenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dia com ocorrências&quot;,&quot;Dia sem ocorrência&quot;,&quot;Dado atrasado&quot;],&quot;default&quot;:&quot;Dia com ocorrências&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Papel e cenário&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'dash', papel: null, cenario: null, unidade: 'shopping-norte', periodo: 'hoje', direcao: 'todos', drawer: null };\n\n  papel() { return this.state.papel ?? this.props.papel ?? 'DP / Financeiro'; }\n  cenario() { return this.state.cenario ?? this.props.cenario ?? 'Dia com ocorrências'; }\n  sup() { return this.papel() === 'Supervisor de unidade'; }\n  /** Única fonte do horário de leitura. Nenhum texto de tela pode fixar horário. */\n  leitura() {\n    const velho = this.cenario() === 'Dado atrasado';\n    return velho\n      ? { velho: true, hora: '07:12', idade: 'há 1h52', proxLabel: 'Tentativa de sincronização', prox: 'em 4 min' }\n      : { velho: false, hora: '08:40', idade: 'há 25 min', proxLabel: 'Próxima leitura', prox: '09:10' };\n  }\n  go(screen) { return () => this.setState({ screen, drawer: null }); }\n\n  chrome() {\n    const sc = this.state.screen;\n    const sup = this.sup();\n    const cen = this.cenario();\n    const item = (id, label, icon, count) => ({\n      id, label, icon, count,\n      go: this.go(id),\n      bg: sc === id ? 'var(--brand)' : 'transparent',\n      fg: sc === id ? '#fff' : 'rgba(231,237,245,0.72)',\n      fw: sc === id ? 700 : 500,\n    });\n    const pages = {\n      dash: ['Gestão de ponto', 'Desvios de jornada no recorte selecionado', 'layout-dashboard'],\n      monitor: ['Monitor diário', 'Jornada em andamento, por unidade', 'activity'],\n      colab: ['Consulta individual', 'Jornada, desvios e histórico do colaborador', 'user-round'],\n      ia: ['Assistente', 'Pergunta em português sobre o dado do tenant', 'sparkles'],\n      folha: ['Folha e custo de pessoal', 'Custo consolidado por período e unidade', 'wallet'],\n      importar: ['Importação de folha', 'Relatório mensal da contabilidade', 'file-up'],\n      alertas: ['Regras de alerta', 'Quem recebe o quê, e em qual formato', 'bell-ring'],\n      admin: ['Administração', 'Unidades, mapeamento, usuários e integração', 'shield'],\n      tv: ['Painel de TV', 'Somente agregado — tela de acesso coletivo', 'monitor'],\n    };\n    const p = pages[sc] || pages.dash;\n    const lt = this.leitura();\n    const velho = lt.velho;\n    const fresh = velho\n      ? { bg: 'var(--alert-background)', border: 'var(--alert-foreground)', dot: 'var(--alert-foreground)', fg: 'var(--alert-foreground)', subFg: 'var(--alert-foreground)', title: 'Dados de ' + lt.hora + ' · ' + lt.idade, s
