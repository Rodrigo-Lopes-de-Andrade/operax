  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

mal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ade39fae-32d1-4076-8fa0-be7fa9a33a4c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d46b8c2c-1a24-4aa3-be9c-9d812f8c40ee\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"63fead31-af59-4034-b162-d5719f7fa63b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Color Tokens\n   Light = :root (default).  Dark = [data-theme=\"dark\"].\n   Base palette is verbatim from the product spec; semantic\n   aliases below map raw values to roles used across the UI.\n   ============================================================ */\n\n:root {\n  /* ---- Categorical (data viz) ---- */\n  --categorical-1: #9FBFFE;\n  --categorical-2: #6D9DFD;\n  --categorical-3: #407FFC;\n  --categorical-4: #015DFC;\n  --categorical-5: #013DF2;\n  --categorical-6: #835FF2;\n  --categorical-7: #FDAD0D;\n  --categorical-8: #F55902;\n\n  /* ---- Foreground (text) ---- */\n  --foreground-primary:    #3D3D3D;\n  --foreground-secondary:  #575757;\n  --foreground-tertiary:   #6E6E6E;\n  --foreground-quaternary: #767676;\n\n  /* ---- Background / surfaces ---- */\n  --background-primary:   #F4F4F4;\n  --background-secondary: #FFFFFF;\n  --background-header:     #111D2D;\n  --background-card:       #FFFFFF;\n  --background-muted:      #F1F1F2;\n\n  /* ---- Semantic states ---- */\n  --bad-foreground:   #C10202;\n  --bad-background:   #FFCCCC;\n  --good-foreground:  #028402;\n  --good-background:  #DCFFDC;\n  --alert-foreground: #996601;\n  --alert-background: #FFF6E6;\n\n  /* ---- Heatmap scale ---- */\n  --heat-minimum: #DCFFDC; /* Baixa  */\n  --heat-center:  #FFF6E6; /* Média  */\n  --heat-maximum: #FFCCCC; /* Alta   */\n\n  /* ============================================================\n     Semantic aliases — prefer these in components\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-app:    var(--background-primary);\n  --surface-raised: var(--background-secondary);\n  --surface-card:   var(--background-card);\n  --surface-muted:  var(--background-muted);\n  --surface-header: var(--background-header);\n  --surface-sidebar: var(--background-header);\n\n  /* Text */\n  --text-strong:  var(--foreground-primary);\n  --text-body:    var(--foreground-secondary);\n  --text-muted:   var(--foreground-tertiary);\n  --text-faint:   var(--foreground-quaternary);\n  --text-on-accent: #FFFFFF;\n  --text-on-dark:   #F5F5F5;\n\n  /* Brand / action */\n  --brand:        var(--categorical-4);   /* #015DFC primary action */\n  --brand-strong: var(--categorical-5);   /* #013DF2 active/pressed  */\n  --brand-soft:   var(--categorical-1);   /* tints, fills            */\n  --accent-violet: var(--categorical-6);\n  --accent-amber:  var(--categorical-7);\n  --accent-orange: #CE4B02;\n\n  /* Borders & lines */\n  --border-subtle:  rgba(17, 29, 45, 0.08);\n  --border-default: rgba(17, 29, 45, 0.12);\n  --border-strong:  rgba(17, 29, 45, 0.18);\n  --border-focus:   var(--categorical-4);\n  --grid-line:      rgba(17, 29, 45, 0.06);\n\n  /* Control fills */\n  --control-bg:        #FFFFFF;\n  --control-bg-hover:  var(--background-muted);\n  --control-border:    rgba(17, 29, 45, 0.14);\n  --control-disabled-bg: var(--background-muted);\n  --control-disabled-fg: var(--foreground-quaternary);\n\n  /* Overlay / scrim */\n  --scrim: rgba(17, 29, 45, 0.45);\n}\n\n[data-theme=\"dark\"] {\n  /* ---- Categorical (data viz) ---- */\n  --categorical-1: #CDDDFE;\n  --categorical-2: #9FBFFE;\n  --categorical-3: #6D9DFD;\n  --categorical-4: #407FFC;\n  --categorical-5: #015DFC;\n  --categorical-6: #835FF2;\n  --categorical-7: #FDBE3F;\n  --categorical-8: #FE8F53;\n\n  /* ---- Foreground (text) ---- */\n  --foreground-primary:    #F5F5F5;\n  --foreground-secondary:  #D1D1D1;\n  --foreground-tertiary:   #9E9E9E;\n  --foreground-quaternary: #6E6E6E;\n\n  /* ---- Background / surfaces ---- */\n  --background-primary:   #111D2D;\n  --background-secondary: #172335;\n  --background-header:     #0B1420;\n  --background-card:       #162233;\n  --background-muted:      #121E2E;\n\n  /* ---- Semantic states ---- */\n  --bad-foreground:   #FE9F9F;\n  --bad-background:   #990101;\n  --good-foreground:  #03FC03;\n  --good-background:  #004100;\n  --alert-foreground: #332200;\n  --alert-background: #FDAD0D;\n\n  /* ---- Heatmap scale (Baixa / Média / Alta) ---- */\n  --heat-minimum: #DCFFDC;\n  --heat-center:  #FFF6E6;\n  --heat-maximum: #FFCCCC;\n\n  /* Semantic overrides for dark */\n  --surface-header: var(--background-header);\n  --surface-sidebar: var(--background-header);\n\n  --brand:        var(--categorical-4);   /* #407FFC */\n  --brand-strong: var(--categorical-5);   /* #015DFC */\n  --brand-soft:   rgba(64, 127, 252, 0.16);\n\n  --text-on-accent: #FFFFFF;\n\n  --border-subtle:  rgba(255, 255, 255, 0.06);\n  --border-default: rgba(255, 255, 255, 0.10);\n  --border-strong:  rgba(255, 255, 255, 0.16);\n  --grid-line:      rgba(255, 255, 255, 0.07);\n\n  --control-bg:        #172335;\n  --control-bg-hover:  #1C2A3F;\n  --control-border:    rgba(255, 255, 255, 0.14);\n  --control-disabled-bg: var(--background-muted);\n  --control-disabled-fg: var(--foreground-quaternary);\n\n  --scrim: rgba(0, 0, 0, 0.6);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Typography Tokens\n   Family: Manrope (UI/display) · JetBrains Mono (codes, figures)\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* Weights */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-extra:    800;\n\n  /* Type scale (rem @ 16px base) */\n  --text-2xs: 0.6875rem;  /* 11px — micro labels, table meta */\n  --text-xs:  0.75rem;    /* 12px — labels, captions         */\n  --text-sm:  0.8125rem;  /* 13px — secondary body, controls */\n  --text-base:0.875rem;   /* 14px — body / default UI        */\n  --text-md:  1rem;       /* 16px — emphasised body          */\n  --text-lg:  1.125rem;   /* 18px — card titles              */\n  --text-xl:  1.375rem;   /* 22px — section headings         */\n  --text-2xl: 1.75rem;    /* 28px — page title               */\n  --text-3xl: 2.25rem;    /* 36px — KPI numbers              */\n  --text-4xl: 3rem;       /* 48px — hero figure              */\n\n  /* Line heights */\n  --leading-tight:   1.15;\n  --leading-snug:    1.3;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.08em;   /* uppercase eyebrow labels */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Spacing & Sizing Tokens\n   4px base grid. Generous breathing room for a premium feel.\n   ============================================================ */\n\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  48px;\n  --space-10: 64px;\n\n  /* Layout */\n  --sidebar-width:           264px;\n  --sidebar-width-collapsed: 76px;\n  --header-height:           84px;\n  --content-max:             1440px;\n  --gutter:                  24px;\n\n  /* Control heights */\n  --control-h-sm: 32px;\n  --control-h-md: 40px;\n  --control-h-lg: 48px;\n  --icon-btn:     40px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Radius Tokens\n   High radii on cards; pill controls; soft fields.\n   ============================================================ */\n\n:root {\n  --radius-xs:   6px;   /* badges, chips meta        */\n  --radius-sm:   8px;   /* inputs (compact)          */\n  --radius-md:   10px;  /* inputs, selects           */\n  --radius-lg:   14px;  /* small cards, tiles        */\n  --radius-xl:   18px;  /* cards                     */\n  --radius-2xl:  24px;  /* main containers           */\n  --radius-pill: 999px; /* buttons, filter pills     */\n  --radius-full: 50%;   /* avatars, icon buttons     */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Elevation / Shadow Tokens\n   Soft, low-opacity shadows tuned to the deep-navy brand.\n   ============================================================ */\n\n:root {\n  --shadow-xs:  0 1px 2px rgba(17, 29, 45, 0.06);\n  --shadow-sm:  0 1px 3px rgba(17, 29, 45, 0.07), 0 1px 2px rgba(17, 29, 45, 0.04);\n  --shadow-md:  0 4px 12px rgba(17, 29, 45, 0.08), 0 2px 4px rgba(17, 29, 45, 0.04);\n  --shadow-lg:  0 12px 28px rgba(17, 29, 45, 0.12), 0 4px 8px rgba(17, 29, 45, 0.05);\n  --shadow-xl:  0 24px 56px rgba(17, 29, 45, 0.16), 0 8px 16px rgba(17, 29, 45, 0.06);\n\n  --shadow-focus: 0 0 0 3px rgba(1, 93, 252, 0.18);\n  --shadow-inset: inset 0 1px 2px rgba(17, 29, 45, 0.05);\n}\n\n[data-theme=\"dark\"] {\n  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.30);\n  --shadow-sm:  0 1px 3px rgba(0, 0, 0, 0.36), 0 1px 2px rgba(0, 0, 0, 0.24);\n  --shadow-md:  0 4px 14px rgba(0, 0, 0, 0.42), 0 2px 4px rgba(0, 0, 0, 0.26);\n  --shadow-lg:  0 14px 34px rgba(0, 0, 0, 0.50), 0 4px 10px rgba(0, 0, 0, 0.30);\n  --shadow-xl:  0 26px 64px rgba(0, 0, 0, 0.58), 0 8px 18px rgba(0, 0, 0, 0.34);\n\n  --shadow-focus: 0 0 0 3px rgba(64, 127, 252, 0.30);\n  --shadow-inset: inset 0 1px 2px rgba(0, 0, 0, 0.35);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Motion Tokens\n   Calm, professional. Quick fades + gentle ease. No bounce.\n   ============================================================ */\n\n:root {\n  --ease-standard:  cubic-bezier(0.2, 0, 0, 1);    /* @kind other */\n  --ease-out:       cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);/* @kind other */\n\n  --duration-fast:  120ms; /* @kind other */\n  --duration-base:  180ms; /* @kind other */\n  --duration-slow:  280ms; /* @kind other */\n\n  --transition-control: background-color var(--duration-fast) var(--ease-standard),\n                        border-color var(--duration-fast) var(--ease-standard),\n                        color var(--duration-fast) var(--ease-standard),\n                        box-shadow var(--duration-fast) var(--ease-standard);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --duration-fast: 0ms; /* @kind other */\n    --duration-base: 0ms; /* @kind other */\n    --duration-slow: 0ms; /* @kind other */\n  }\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Aegis — Base resets & helpers\n   Light defaults; honors [data-theme=\"dark\"] via color tokens.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-app);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  font-feature-settings: 'cv11', 'ss01';\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  color: var(--text-strong);\n  font-weight: var(--weight-bold);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n}\n\np { margin: 0; }\n\na { color: var(--brand); text-decoration: none; }\n\nbutton { font-family: inherit; }\n\n/* Tabular figures for data / KPIs */\n.aegis-tnum { font-variant-numeric: tabular-nums; }\n.aegis-mono { font-family: var(--font-mono); }\n\n/* Lucide icon wrapper */\n.aegis-icon { display: inline-flex; line-height: 0; flex: none; }\n.aegis-icon svg { width: 100%; height: 100%; stroke-width: var(--aegis-sw, 2); }\n\n@keyframes aegis-spin { to { transform: rotate(360deg); } }\n.aegis-spin { animation: aegis-spin 0.7s linear infinite; }\n\n@keyframes aegis-shimmer { 0% { opacity: 0.55; } 50% { opacity: 1; } 100% { opacity: 0.55; } }\n.aegis-skel { animation: aegis-shimmer 1.3s var(--ease-in-out) infinite; }\n\n/* Uppercase eyebrow label */\n.aegis-eyebrow {\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* Custom scrollbars */\n* {\n  scrollbar-width: thin;\n  scrollbar-color: var(--border-strong) transparent;\n}\n*::-webkit-scrollbar { width: 10px; height: 10px; }\n*::-webkit-scrollbar-thumb {\n  background: var(--border-strong);\n  border-radius: var(--radius-pill);\n  border: 3px solid transparent;\n  background-clip: content-box;\n}\n*::-webkit-scrollbar-thumb:hover { background: var(--foreground-quaternary); background-clip: content-box; }\n\n:focus-visible {\n  outline: 2px solid var(--border-focus);\n  outline-offset: 2px;\ FFF;\n  --background-muted:      #F1F1F2;\n\n  /* ---- Semantic states ---- */\n  --bad-foreground:   #C10202;\n  --bad-background:   #FFCCCC;\n  --good-foreground:  #028402;\n  --good-background:  #DCFFDC;\n  --alert-foreground: #996601;\n  --alert-background: #FFF6E6;\n\n  /* ---- Heatmap scale ---- */\n  --heat-minimum: #DCFFDC; /* Baixa  */\n  --heat-center:  #FFF6E6; /* Média  */\n  --heat-maximum: #FFCCCC; /* Alta   */\n\n  /* ============================================================\n     Semantic aliases — prefer these in components\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-app:    var(--background-primary);\n  --surface-raised: var(--background-secondary);\n  --surface-card:   var(--background-card);\n  --surface-muted:  var(--background-muted);\n  --surface-header: var(--background-header);\n  --surface-sidebar: var(--background-header);\n\n  /* Text */\n  --text-strong:  var(--foreground-primary);\n  --text-body:    var(--foreground-secondary);\n  --text-muted:   var(--foreground-tertiary);\n  --text-faint:   var(--foreground-quaternary);\n  --text-on-accent: #FFFFFF;\n  --text-on-dark:   #F5F5F5;\n\n  /* Brand / action */\n  --brand:        var(--categorical-4);   /* #015DFC primary action */\n  --brand-strong: var(--categorical-5);   /* #013DF2 active/pressed  */\n  --brand-soft:   var(--categorical-1);   /* tints, fills            */\n  --accent-violet: var(--categorical-6);\n  --accent-amber:  var(--categorical-7);\n  --accent-orange: #CE4B02;\n\n  /* Borders & lines */\n  --border-subtle:  rgba(17, 29, 45, 0.08);\n  --border-default: rgba(17, 29, 45, 0.12);\n  --border-strong:  rgba(17, 29, 45, 0.18);\n  --border-focus:   var(--categorical-4);\n  --grid-line:      rgba(17, 29, 45, 0.06);\n\n  /* Control fills */\n  --control-bg:        #FFFFFF;\n  --control-bg-hover:  var(--background-muted);\n  --control-border:    rgba(17, 29, 45, 0.14);\n  --control-disabled-bg: var(--background-muted);\n  --control-disabled-fg: var(--foreground-quaternary);\n\n  /* Overlay / scrim */\n  --scrim: rgba(17, 29, 45, 0.45);\n}\n\n[data-theme=\"dark\"] {\n  /* ---- Categorical (data viz) ---- */\n  --categorical-1: #CDDDFE;\n  --categorical-2: #9FBFFE;\n  --categorical-3: #6D9DFD;\n  --categorical-4: #407FFC;\n  --categorical-5: #015DFC;\n  --categorical-6: #835FF2;\n  --categorical-7: #FDBE3F;\n  --categorical-8: #FE8F53;\n\n  /* ---- Foreground (text) ---- */\n  --foreground-primary:    #F5F5F5;\n  --foreground-secondary:  #D1D1D1;\n  --foreground-tertiary:   #9E9E9E;\n  --foreground-quaternary: #6E6E6E;\n\n  /* ---- Background / surfaces ---- */\n  --background-primary:   #111D2D;\n  --background-secondary: #172335;\n  --background-header:     #0B1420;\n  --background-card:       #162233;\n  --background-muted:      #121E2E;\n\n  /* ---- Semantic states ---- */\n  --bad-foreground:   #FE9F9F;\n  --bad-background:   #990101;\n  --good-foreground:  #03FC03;\n  --good-background:  #004100;\n  --alert-foreground: #332200;\n  --alert-background: #FDAD0D;\n\n  /* ---- Heatmap scale (Baixa / Média / Alta) ---- */\n  --heat-minimum: #DCFFDC;\n  --heat-center:  #FFF6E6;\n  --heat-maximum: #FFCCCC;\n\n  /* Semantic overrides for dark */\n  --surface-header: var(--background-header);\n  --surface-sidebar: var(--background-header);\n\n  --brand:        var(--categorical-4);   /* #407FFC */\n  --brand-strong: var(--categorical-5);   /* #015DFC */\n  --brand-soft:   rgba(64, 127, 252, 0.16);\n\n  --text-on-accent: #FFFFFF;\n\n  --border-subtle:  rgba(255, 255, 255, 0.06);\n  --border-default: rgba(255, 255, 255, 0.10);\n  --border-strong:  rgba(255, 255, 255, 0.16);\n  --grid-line:      rgba(255, 255, 255, 0.07);\n\n  --control-bg:        #172335;\n  --control-bg-hover:  #1C2A3F;\n  --control-border:    rgba(255, 255, 255, 0.14);\n  --control-disabled-bg: var(--background-muted);\n  --control-disabled-fg: var(--foreground-quaternary);\n\n  --scrim: rgba(0, 0, 0, 0.6);\n}\n\n/* ============================================================\n   Aegis — Typography Tokens\n   Family: Manrope (UI/display) · JetBrains Mono (codes, figures)\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* Weights */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-extra:    800;\n\n  /* Type scale (rem @ 16px base) */\n  --text-2xs: 0.6875rem;  /* 11px — micro labels, table meta */\n  --text-xs:  0.75rem;    /* 12px — labels, captions         */\n  --text-sm:  0.8125rem;  /* 13px — secondary body, controls */\n  --text-base:0.875rem;   /* 14px — body / default UI        */\n  --text-md:  1rem;       /* 16px — emphasised body          */\n  --text-lg:  1.125rem;   /* 18px — card titles              */\n  --text-xl:  1.375rem;   /* 22px — section headings         */\n  --text-2xl: 1.75rem;    /* 28px — page title               */\n  --text-3xl: 2.25rem;    /* 36px — KPI numbers              */\n  --text-4xl: 3rem;       /* 48px — hero figure              */\n\n  /* Line heights */\n  --leading-tight:   1.15;\n  --leading-snug:    1.3;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.08em;   /* uppercase eyebrow labels */\n}\n\n/* ============================================================\n   Aegis — Spacing & Sizing Tokens\n   4px base grid. Generous breathing room for a premium feel.\n   ============================================================ */\n\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  48px;\n  --space-10: 64px;\n\n  /* Layout */\n  --sidebar-width:           264px;\n  --sidebar-width-collapsed: 76px;\n  --header-height:           84px;\n  --content-max:             1440px;\n  --gutter:                  24px;\n\n  /* Control heights */\n  --control-h-sm: 32px;\n  --control-h-md: 40px;\n  --control-h-lg: 48px;\n  --icon-btn:     40px;\n}\n\n/* ============================================================\n   Aegis — Radius Tokens\n   High radii on cards; pill controls; soft fields.\n   ============================================================ */\n\n:root {\n  --radius-xs:   6px;   /* badges, chips meta        */\n  --radius-sm:   8px;   /* inputs (compact)          */\n  --radius-md:   10px;  /* inputs, selects           */\n  --radius-lg:   14px;  /* small cards, tiles        */\n  --radius-xl:   18px;  /* cards                     */\n  --radius-2xl:  24px;  /* main containers           */\n  --radius-pill: 999px; /* buttons, filter pills     */\n  --radius-full: 50%;   /* avatars, icon buttons     */\n}\n\n/* ============================================================\n   Aegis — Elevation / Shadow Tokens\n   Soft, low-opacity shadows tuned to the deep-navy brand.\n   ============================================================ */\n\n:root {\n  --shadow-xs:  0 1px 2px rgba(17, 29, 45, 0.06);\n  --shadow-sm:  0 1px 3px rgba(17, 29, 45, 0.07), 0 1px 2px rgba(17, 29, 45, 0.04);\n  --shadow-md:  0 4px 12px rgba(17, 29, 45, 0.08), 0 2px 4px rgba(17, 29, 45, 0.04);\n  --shadow-lg:  0 12px 28px rgba(17, 29, 45, 0.12), 0 4px 8px rgba(17, 29, 45, 0.05);\n  --shadow-xl:  0 24px 56px rgba(17, 29, 45, 0.16), 0 8px 16px rgba(17, 29, 45, 0.06);\n\n  --shadow-focus: 0 0 0 3px rgba(1, 93, 252, 0.18);\n  --shadow-inset: inset 0 1px 2px rgba(17, 29, 45, 0.05);\n}\n\n[data-theme=\"dark\"] {\n  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.30);\n  --shadow-sm:  0 1px 3px rgba(0, 0, 0, 0.36), 0 1px 2px rgba(0, 0, 0, 0.24);\n  --shadow-md:  0 4px 14px rgba(0, 0, 0, 0.42), 0 2px 4px rgba(0, 0, 0, 0.26);\n  --shadow-lg:  0 14px 34px rgba(0, 0, 0, 0.50), 0 4px 10px rgba(0, 0, 0, 0.30);\n  --shadow-xl:  0 26px 64px rgba(0, 0, 0, 0.58), 0 8px 18px rgba(0, 0, 0, 0.34);\n\n  --shadow-focus: 0 0 0 3px rgba(64, 127, 252, 0.30);\n  --shadow-inset: inset 0 1px 2px rgba(0, 0, 0, 0.35);\n}\n\n/* ============================================================\n   Aegis — Motion Tokens\n   Calm, professional. Quick fades + gentle ease. No bounce.\n   ============================================================ */\n\n:root {\n  --ease-standard:  cubic-bezier(0.2, 0, 0, 1);    /* @kind other */\n  --ease-out:       cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);/* @kind other */\n\n  --duration-fast:  120ms; /* @kind other */\n  --duration-base:  180ms; /* @kind other */\n  --duration-slow:  280ms; /* @kind other */\n\n  --transition-control: background-color var(--duration-fast) var(--ease-standard),\n                        border-color var(--duration-fast) var(--ease-standard),\n                        color var(--duration-fast) var(--ease-standard),\n                        box-shadow var(--duration-fast) var(--ease-standard);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --duration-fast: 0ms; /* @kind other */\n    --duration-base: 0ms; /* @kind other */\n    --duration-slow: 0ms; /* @kind other */\n  }\n}\n\n/* ============================================================\n   Aegis — Base resets & helpers\n   Light defaults; honors [data-theme=\"dark\"] via color tokens.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-app);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  font-feature-settings: 'cv11', 'ss01';\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  color: var(--text-strong);\n  font-weight: var(--weight-bold);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n}\n\np { margin: 0; }\n\na { color: var(--brand); text-decoration: none; }\n\nbutton { font-family: inherit; }\n\n/* Tabular figures for data / KPIs */\n.aegis-tnum { font-variant-numeric: tabular-nums; }\n.aegis-mono { font-family: var(--font-mono); }\n\n/* Lucide icon wrapper */\n.aegis-icon { display: inline-flex; line-height: 0; flex: none; }\n.aegis-icon svg { width: 100%; height: 100%; stroke-width: var(--aegis-sw, 2); }\n\n@keyframes aegis-spin { to { transform: rotate(360deg); } }\n.aegis-spin { animation: aegis-spin 0.7s linear infinite; }\n\n@keyframes aegis-shimmer { 0% { opacity: 0.55; } 50% { opacity: 1; } 100% { opacity: 0.55; } }\n.aegis-skel { animation: aegis-shimmer 1.3s var(--ease-in-out) infinite; }\n\n/* Uppercase eyebrow label */\n.aegis-eyebrow {\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* Custom scrollbars */\n* {\n  scrollbar-width: thin;\n  scrollbar-color: var(--border-strong) transparent;\n}\n*::-webkit-scrollbar { width: 10px; height: 10px; }\n*::-webkit-scrollbar-thumb {\n  background: var(--border-strong);\n  border-radius: var(--radius-pill);\n  border: 3px solid transparent;\n  background-clip: content-box;\n}\n*::-webkit-scrollbar-thumb:hover { background: var(--foreground-quaternary); background-clip: content-box; }\n\n:focus-visible {\n  outline: 2px solid var(--border-focus);\n  outline-offset: 2px;\n}\n\n<\u002Fstyle>\n<script src=\"c3c5b1e1-866d-42b1-9196-7fd8a12e8b87\"><\u002Fscript>\n<script src=\"6e792779-6bd1-4cc7-b7b8-e046772d3c2a\"><\u002Fscript>\n<script src=\"68968f4f-ae8d-4e0c-b9de-7d5a584f6cfb\"><\u002Fscript>\n<style sm\" icon=\"settings-2\" sc-camel-on-click=\"{{ alr.irIntegracoes }}\" hint-size=\"auto,32px\">Trocar provedor<\u002Fx-import>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:flex-start; gap:12px; padding:14px; border-radius:var(--radius-lg); border:1px solid var(--border-default); background:var(--surface-card)\">\n                  <span style=\"display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; flex:none; border-radius:var(--radius-md); background:var(--brand-soft); color:var(--brand)\">\n                    <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"{{ alr.provIcon }}\" size=\"17\" hint-size=\"17px,17px\"><\u002Fx-import>\n                  <\u002Fspan>\n                  <div style=\"flex:1; min-width:0\">\n                    <div style=\"font-size:var(--text-sm); font-weight:700; color:var(--text-strong)\">{{ alr.provNome }}<\u002Fdiv>\n                    <p style=\"font-size:var(--text-xs); color:var(--text-muted); margin-top:3px; text-wrap:pretty\">{{ alr.provNota }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ alr.temTemplate }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:12px; border:1px solid var(--border-default); border-radius:var(--radius-lg); overflow:hidden\">\n                    <div style=\"display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface-muted); border-bottom:1px solid var(--border-subtle); flex-wrap:wrap\">\n                      <span class=\"aegis-mono\" style=\"font-size:var(--text-xs); font-weight:600; color:var(--text-strong)\">{{ alr.tpl.id }}<\u002Fspan>\n                      <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Badge\" tone=\"{{ alr.tpl.tom }}\" size=\"sm\" dot=\"{{ true }}\" hint-size=\"auto,20px\">{{ alr.tpl.estado }}<\u002Fx-import>\n                      <sp px\">\n                      <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Icon\" name=\"{{ alr.falhaIcon }}\" size=\"18\" hint-size=\"18px,18px\"><\u002Fx-import>\n                    <\u002Fspan>\n                    <div>\n                      <div style=\"font-size:var(--text-sm); font-weight:700; color:{{ alr.falhaFg }}\">{{ alr.falhaTitulo }}<\u002Fdiv>\n                      <p style=\"font-size:var(--text-xs); color:{{ alr.falhaFg }}; margin-top:5px; text-wrap:pretty\">{{ alr.falhaTexto }}<\u002Fp>\n                      <div style=\"display:flex; gap:8px; margin-top:10px; flex-wrap:wrap\">\n                        <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"secondary\" size=\"sm\" icon=\"send\" hint-size=\"auto,32px\">Enviar template para aprovação<\u002Fx-import>\n                        <sc-if value=\"{{ alr.falhaLigada }}\">\n                          <x-import component-from-global-scope=\"AegisDesignSystem_86ea41.Button\" variant=\"ghost\" size=\"sm\" icon=\"power-off\" sc-camel-on-click=\"{{ alr.desligarRegra }}\" hint-size=\"auto,32px\">Desligar a regra até aprovar<\u002Fx-import>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"height:1px; background:var(--border-subtle)\"><\u002Fdiv>\n\n              <div>\n                <div style=\"font-size:var(--text-sm); font-weight:700; color:var(--text-strong); margin-bottom:10px\">Conteúdo da mensagem<\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px\">\n                  <sc-for list=\"{{ alr.conteudoOpts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ c.escolher }}\" style=\"text-align:left; padding:14px; border-radius:var(--radius-lg); cursor:pointer; font-family:var(--font-sans
