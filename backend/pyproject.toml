[project]
name = "operax"
version = "0.1.0"
description = "OperaX backend — management, automation and intelligence over time-clock systems."
# Ceiling on purpose: psycopg-binary publishes no cp314 wheel yet, and without it
# the install falls back to building libpq from source.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    # O template de RH e o arquivo que volta preenchido. Sem compilacao, e a
    # unica biblioteca que faz as tres coisas que o template precisa: proteger a
    # planilha, esconder a aba de controle e alimentar dropdown de enum.
    "openpyxl>=3.1",
    # O arquivo importado vive no Storage do Supabase, que so tem API HTTP.
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=3.0",
    # O PDF do ciclo mensal (`operax/dp/export.py`). Puro Python, sem compilar,
    # e as fontes base cobrem pt-BR sem arquivo de fonte embutido — a mesma razao
    # pela qual openpyxl entrou. Escrever um serializador de PDF a mao daria
    # controle que esta tabela nao precisa e arquivos que leitor nenhum garante.
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operax", "server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
